<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="margin:0;padding:0;background:#080706;">
  <tr>
    <td align="center" style="padding:36px 16px;font-family:Arial,Helvetica,sans-serif;">
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;background:#14110e;border:1px solid #d8b35f55;border-radius:28px;overflow:hidden;">
        <tr>
          <td style="padding:34px 28px;text-align:center;">
            <div style="display:inline-block;width:58px;height:58px;border-radius:50%;border:1px solid #d8b35f66;background:#d8b35f18;line-height:58px;color:#d8b35f;font-size:26px;">

            </div>
            <h1 style="margin:22px 0 0;color:#f7ead1;font-size:32px;line-height:1.1;font-weight:800;">
              Restaurant App

            <p style="margin:8px 0 0;color:#d8b35f;font-size:11px;font-weight:700;letter-spacing:5px;text-transform:uppercase;">

            </p>
          </td>
        </tr>
        <tr>
          <td style="padding:0 28px 34px;text-align:center;">
            <div style="background:#080706;border:1px solid #d8b35f33;border-radius:24px;padding:26px 18px;">

              </p>
              <div style="margin:22px 0;color:#d8b35f;font-size:42px;line-height:1.1;font-weight:900;letter-spacing:8px;">
                {{ .Token }}
              </div>
              <p style="margin:0;color:#f7ead188;font-size:13px;line-height:1.6;">
                Введите этот код на сайте. Если вы не входили в аккаунт, просто игнорируйте письмо.
              </p>
